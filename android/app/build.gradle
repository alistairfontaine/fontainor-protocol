apply plugin: 'com.android.application'

// Release signing via android/key.properties (kept OUT of git). If absent
// (e.g. a clean checkout with no keystore), release falls back to debug
// signing so `assembleRelease` still produces an installable APK.
// Pattern mirrored from lanlink/emberdelve.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.fontainor.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fontainor.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "4.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // English-only UI strings — drop other locale resources to slim the APK.
        resourceConfigurations += ["en"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // ...plus '!*.map': the web build emits source maps beside every
            // chunk and `cap sync` copies them into assets/public. They were
            // 8.7 MB of the 15.5 MB v4.2.0/v4.3.0 APK — more than half the
            // download, for files no device ever reads. The web deploy keeps
            // its maps; only the APK drops them.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.map'
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // R8 + resource shrinking. A WebView shell has almost no reflection
            // surface, but keep the (empty) app rules file for future plugins.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // No ABI splits. This shell ships ZERO native libraries (verified: no lib/
    // directory and 0 .so files in the built APK), so per-ABI splits emitted four
    // byte-identical 12.6 MiB APKs -- same md5 for armeabi-v7a, arm64-v8a, x86_64
    // and universal. That quadrupled the CI artifact and invited people to
    // sideload an "arm64" file that is really the universal one. If a plugin with
    // native code is ever added, re-enable splits AND give each ABI its own
    // versionCode offset, which the old block also failed to do.
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// A Capacitor plugin transitively pulls the legacy kotlin-stdlib-jdk7/jdk8
// (1.6.21), which duplicate classes now merged into the unified kotlin-stdlib
// (1.8+). Redirect the split artifacts to the unified stdlib to kill the
// "Duplicate class kotlin.*" merge failure.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
            details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        }
    }
    resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Solana Mobile Wallet Adapter — native one-tap connect to any installed
    // MWA wallet (Phantom, Solflare, Backpack, ...). Used by MwaPlugin.
    implementation "com.solanamobile:mobile-wallet-adapter-clientlib:2.0.8"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
